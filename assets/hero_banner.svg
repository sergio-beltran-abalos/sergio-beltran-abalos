<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Base container -->
  <rect width="1200" height="310" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="16" fill="url(#grid)" opacity="0.65"/>
  <rect width="1200" height="310" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="310" rx="16" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="308" rx="15" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top accent bar -->
  <rect x="44" y="34" width="76" height="4" rx="2" fill="url(#accent)"/>

  <!-- Decorative robotics kinematic arm + PCB trace motif (right side) -->
  <g opacity="0.88" transform="translate(835, 36)">
    <!-- Subtle coordinate grid box -->
    <rect x="0" y="0" width="322" height="238" rx="12" fill="#0B1325" fill-opacity="0.72" stroke="#1E293B" stroke-width="1.2"/>
    <text x="16" y="24" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.2">SYSTEMS // SIM-TO-REAL PIPELINE</text>
    <circle cx="298" cy="20" r="4" fill="#34D399"/>
    <circle cx="284" cy="20" r="4" fill="#38BDF8"/>

    <!-- Stylized 4-DOF kinematic links -->
    <line x1="56" y1="196" x2="176" y2="196" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <rect x="82" y="176" width="68" height="20" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4"/>
    <!-- Link 1 -->
    <line x1="116" y1="176" x2="116" y2="136" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <!-- Link 2 -->
    <line x1="116" y1="136" x2="184" y2="82" stroke="#22D3EE" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Link 3 -->
    <line x1="184" y1="82" x2="246" y2="102" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    <!-- End effector -->
    <line x1="246" y1="102" x2="246" y2="146" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="246" cy="154" r="5" fill="#34D399"/>
    <!-- Target crosshairs -->
    <circle cx="246" cy="176" r="11" stroke="#34D399" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="230" y1="176" x2="262" y2="176" stroke="#34D399" stroke-width="1" opacity="0.7"/>
    <line x1="246" y1="160" x2="246" y2="192" stroke="#34D399" stroke-width="1" opacity="0.7"/>

    <!-- Joint nodes -->
    <circle cx="116" cy="136" r="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="184" cy="82" r="7.5" fill="#0F172A" stroke="#22D3EE" stroke-width="2.5"/>
    <circle cx="246" cy="102" r="6.5" fill="#0F172A" stroke="#34D399" stroke-width="2.5"/>

    <!-- Telemetry micro-labels -->
    <text x="16" y="64" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11">ROS 2 / micro-ROS : 50 Hz</text>
    <text x="16" y="82" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11">NARX / GA-PI Loop : 100 Hz</text>
    <text x="16" y="100" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11">S7-1200 / KTP700  : PROFINET</text>
    <text x="16" y="222" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="11">STATUS: READY FOR JAN 2027 INTERNSHIP</text>
  </g>

  <!-- Main typography -->
  <text x="44" y="96" fill="#F8FAFC" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Sergio Edmundo Beltran Abalos</text>

  <text x="44" y="136" fill="url(#accent)" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Mechatronics Engineering · Robotics · Control · Industrial Automation</text>

  <text x="44" y="172" fill="#CBD5E1" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15.5">UTEC (Lima, Peru) · President @ IEEE RAS UTEC · Undergraduate Researcher @ RIC</text>

  <text x="44" y="200" fill="#94A3B8" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5">Taking robotic and industrial control systems from simulation to physical validation.</text>

  <!-- Pill tags -->
  <g transform="translate(44, 230)">
    <rect x="0" y="0" width="166" height="32" rx="16" fill="#172554" stroke="#38BDF8" stroke-width="1"/>
    <text x="83" y="21" text-anchor="middle" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">ROS 2 · micro-ROS</text>

    <rect x="178" y="0" width="176" height="32" rx="16" fill="#0F2937" stroke="#22D3EE" stroke-width="1"/>
    <text x="266" y="21" text-anchor="middle" fill="#CFFAFE" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">Siemens S7-1200 · HMI</text>

    <rect x="366" y="0" width="176" height="32" rx="16" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <text x="454" y="21" text-anchor="middle" fill="#E0E7FF" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">RL &amp; Agentic AI × AWS</text>

    <rect x="554" y="0" width="204" height="32" rx="16" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
    <text x="656" y="21" text-anchor="middle" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">Internship · Jan 2027 (6 mo)</text>
  </g>
</svg>
