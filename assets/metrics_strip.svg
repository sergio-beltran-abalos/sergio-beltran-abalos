<svg width="1200" height="118" viewBox="0 0 1200 118" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <g transform="translate(0, 4)">
    <rect width="286" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.4"/>
    <rect x="0" y="0" width="286" height="4" rx="2" fill="#38BDF8"/>
    <text x="20" y="44" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">0.8 mm</text>
    <text x="20" y="69" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Mean Positioning Error</text>
    <text x="20" y="90" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">4-DOF ROS 2 / micro-ROS @ 50 Hz</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(304, 4)">
    <rect width="286" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.4"/>
    <rect x="0" y="0" width="286" height="4" rx="2" fill="#22D3EE"/>
    <text x="20" y="44" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">100 Hz</text>
    <text x="20" y="69" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">6-Controller Benchmark</text>
    <text x="20" y="90" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">NARX &lt; 0.02 rad · GA-PI 0.0459 rad</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(608, 4)">
    <rect width="286" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.4"/>
    <rect x="0" y="0" width="286" height="4" rx="2" fill="#34D399"/>
    <text x="20" y="44" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">23.7 g</text>
    <text x="20" y="69" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">CubeSat Impact Survived</text>
    <text x="20" y="90" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">NEX-Sat 1U · Top 24 / 200+ CNPS</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(912, 4)">
    <rect width="288" height="110" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.4"/>
    <rect x="0" y="0" width="288" height="4" rx="2" fill="#818CF8"/>
    <text x="20" y="44" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">40+</text>
    <text x="20" y="69" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Robotics Initiatives Led</text>
    <text x="20" y="90" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">President, IEEE RAS UTEC (7 countries)</text>
  </g>
